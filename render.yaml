# Instellingen voor Render.com (gratis versie). De gegevens staan in een gratis Turso-database,
# omdat de gratis Render-server geen blijvende schijf heeft.
services:
  - type: web
    name: spaceverbs
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ik
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
